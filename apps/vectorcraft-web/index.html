<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>VectorCraft</title>
  <link data-trunk rel="icon" type="image/x-icon" href="../../assets/app-icon/vectorcraft.ico" />
  <link data-trunk rel="icon" type="image/svg+xml" href="../../assets/app-icon/vectorcraft-small.svg" />
  <link data-trunk rel="rust" data-bin="vectorcraft-web" data-wasm-opt="0" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #vectorcraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #vectorcraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
    .vc-loader-card { display: flex; flex-direction: column; align-items: center; padding: 24px 32px; background: #1e1e1e; border: 1px solid #383838; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .vc-loader-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .vc-loader-icon { width: 24px; height: 24px; color: #18a0fb; }
    .vc-loader-title { font-size: 16px; font-weight: 600; color: #ffffff; letter-spacing: -0.2px; }
    .vc-progress-track { width: 220px; height: 4px; background: #333333; border-radius: 2px; overflow: hidden; position: relative; margin: 12px 0 8px 0; }
    .vc-progress-fill { position: absolute; top: 0; left: -50%; width: 50%; height: 100%; background: linear-gradient(90deg, transparent, #18a0fb, transparent); animation: vc-shimmer 1.4s ease-in-out infinite; }
    @keyframes vc-shimmer { 0% { left: -50%; } 100% { left: 100%; } }
    .vc-loader-status { font-size: 13px; color: #888888; }
    .vc-loader-legal { margin-top: 14px; font-size: 11px; color: #666666; pointer-events: auto; }
    .vc-loader-legal a { color: #888888; text-decoration: none; }
    .vc-loader-legal a:hover { color: #18a0fb; text-decoration: underline; }
  </style>
</head>
<body>
  <canvas id="vectorcraft_canvas"></canvas>
  <div id="vectorcraft_loading">
    <div class="vc-loader-card">
      <div class="vc-loader-brand">
        <svg class="vc-loader-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        <span class="vc-loader-title">VectorCraft</span>
      </div>
      <div class="vc-progress-track">
        <div class="vc-progress-fill"></div>
      </div>
      <div id="vectorcraft_loading_status" class="vc-loader-status">Lade VectorCraft&hellip;</div>
      <div class="vc-loader-legal">
        <a href="/impressum" target="_blank" rel="noopener">Impressum</a> &middot; <a href="/datenschutz" target="_blank" rel="noopener">Datenschutz</a>
      </div>
    </div>
  </div>
</body>
</html>
