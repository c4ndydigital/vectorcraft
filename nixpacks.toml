# Nixpacks configuration for VectorCraft on Coolify and Railway
# Docs: https://nixpacks.com/docs/configuration/file

[variables]
# Disable musl to ensure standard glibc target and produce ./target/release/vectorcraft-server
NIXPACKS_NO_MUSL = "1"
# Default environment variables for the container runtime
PORT = "8767"
BIND = "0.0.0.0"
DIST_DIR = "dist/web"

[phases.setup]
# Extend Nixpacks default packages with build tools and binaryen (provides wasm-opt for Trunk)
nixPkgs = ["...", "curl", "pkg-config", "binaryen"]

[phases.install]
# Provision wasm32-unknown-unknown target and prebuilt trunk binary (pinned v0.21.14 with multi-arch detection)
cmds = [
  "rustup target add wasm32-unknown-unknown || true",
  'which trunk || (ARCH="$(uname -m)"; case "$ARCH" in x86_64) T_ARCH="x86_64-unknown-linux-gnu" ;; aarch64|arm64) T_ARCH="aarch64-unknown-linux-gnu" ;; *) echo "Unsupported architecture: $ARCH" && exit 1 ;; esac && curl -fsSL "https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-${T_ARCH}.tar.gz" | tar -xzf - -C /usr/local/bin && chmod +x /usr/local/bin/trunk)'
]

[phases.build]
# 1. Build the production WebAssembly bundle into dist/web
# 2. Compile ONLY the headless server binary (avoids attempting to build desktop GUI apps)
cmds = [
  "cd apps/vectorcraft-web && trunk build --release",
  "cargo build --release --bin vectorcraft-server"
]

[start]
# Launch server with dynamic $PORT and $BIND expansion (fallback to 8767 / 0.0.0.0)
cmd = "./target/release/vectorcraft-server --port ${PORT:-8767} --bind ${BIND:-0.0.0.0} --dist dist/web"
